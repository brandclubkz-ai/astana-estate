name: Обновление объявлений

on:
  schedule:
    - cron: "0 */3 * * *"   # каждые 3 часа
  workflow_dispatch:          # и кнопка ручного запуска

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать объявления
        run: python scraper/scrape.py

      - name: Закоммитить данные
        run: |
          git config user.name "estate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet || git commit -m "Обновление объявлений $(date -u +'%Y-%m-%d %H:%M')"
          git push
